- question: 税・外貨換算・複数明細の場合に判定対象とする金額は何か
  source: IMP-003
  resolution: 5万円以上の判定には、申請単位の精算予定総額（税込・日本円換算後）を使用する。複数明細は合算し、外貨明細は組織で定める換算ルールにより日本円へ換算する。
