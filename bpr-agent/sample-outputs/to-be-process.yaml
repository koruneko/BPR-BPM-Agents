      target_edge_ids:
      - e19
      - e20
      - e22
      - e25
      - e26
      - e27
    - improvement_id: IMP-008
      title: 振込入力と実行結果の記録を標準化
      action: applied
      summary: 振込対象、金額、口座参照、支払日、申請IDを標準入力とし、振込受付番号、実行日時、成否、失敗理由を結果として記録する。失敗時の再実行・取消・照合手順は業務ルールとして定義する。
      expected_effect:
